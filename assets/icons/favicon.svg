<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" />
      <stop offset="100%" stop-color="#141625" />
    </linearGradient>
    <linearGradient id="hanziGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6e0ad" />
      <stop offset="100%" stop-color="#dfb46c" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Badge Accent -->
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="rgba(223, 180, 108, 0.15)" stroke-width="2" />

  <!-- Stylized Hanzi Character 汉 -->
  <text x="256" y="340" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="280" font-weight="bold" fill="url(#hanziGrad)" text-anchor="middle">汉</text>
</svg>
