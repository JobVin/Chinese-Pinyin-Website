<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanzi Writer Drawing Utility - Standalone Test</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px 20px;
      margin: 0;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .test-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .test-card h2 {
      font-size: 18px;
      color: #f1f5f9;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-trace {
      background: #0284c7;
      color: #ffffff;
    }
    .badge-quiz {
      background: #059669;
      color: #ffffff;
    }
    .leniency-tag {
      font-size: 12px;
      background: #334155;
      color: #cbd5e1;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .result-display {
      margin-top: 16px;
      background: #0f172a;
      border-left: 4px solid #10b981;
      padding: 14px 18px;
      border-radius: 8px;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      color: #a7f3d0;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>Hanzi Writer Drawing Utility Verification</h1>
    <p class="subtitle">Standalone test page verifying <code>HanziDrawing.renderWordDrawer</code> (trace) and <code>HanziDrawing.runWordQuiz</code> (quiz with leniency).</p>

    <!-- TEST 1: TRACE MODE -->
    <div class="test-card">
      <h2><span class="badge badge-trace">Trace Mode</span> Single Character: 爱</h2>
      <div id="trace-container"></div>
    </div>

    <!-- TEST 2: QUIZ MODE -->
    <div class="test-card">
      <h2>
        <span class="badge badge-quiz">Quiz Mode</span> Multi-Character Word: 学校
        <span class="leniency-tag">Leniency: 1.6 (Touchscreen Forgiving)</span>
      </h2>
      <div id="quiz-container"></div>
      <div id="quiz-result-display" class="result-display"></div>
    </div>
  </div>

  <!-- Hanzi Writer CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@latest/dist/hanzi-writer.min.js"></script>
  <!-- HanziDrawing Shared Utility -->
  <script src="drawing.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Render Trace Mode for Single-Character "爱"
      const traceContainer = document.getElementById('trace-container');
      HanziDrawing.renderWordDrawer(traceContainer, '爱', 'trace');

      // 2. Render Quiz Mode for Multi-Character "学校"
      const quizContainer = document.getElementById('quiz-container');
      const resultDisplay = document.getElementById('quiz-result-display');

      HanziDrawing.runWordQuiz(quizContainer, '学校', (result) => {
        console.log('Quiz Complete Result:', result);
        resultDisplay.style.display = 'block';

        let breakdownText = `🎉 Word Quiz Complete: "${result.characterString}"\n`;
        breakdownText += `Total Strokes: ${result.totalStrokes}\n`;
        breakdownText += `Total Mistakes: ${result.totalMistakes}\n\n`;
        breakdownText += `Per-Character Breakdown:\n`;

        result.perCharacter.forEach((charRes, idx) => {
          breakdownText += `  [Char ${idx + 1}] '${charRes.character}' -> Strokes: ${charRes.strokeCount}, Mistakes: ${charRes.totalMistakes}\n`;
        });

        breakdownText += `\nFull Output JSON:\n` + JSON.stringify(result, null, 2);
        resultDisplay.textContent = breakdownText;
      });
    });
  </script>
</body>
</html>
